# General
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on

# Terminal
set -s default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -ga terminal-features ',xterm-ghostty:cursor'

# Windows
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Clipboard
# Accept OSC 52 from applications and forward it to the outer terminal.
set -s set-clipboard on
# Support clipboard forwarding through nested tmux sessions.
set -as terminal-features ',tmux*:clipboard,screen*:clipboard'

# Copy mode
set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window
bind c new-window -c "#{pane_current_path}"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Rosé Pine
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_window_status_separator ' '

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'

if-shell 'test -f "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
