[settings]
dotfiles.default_mode = "symlink"

[tools]
ghq = "latest"
helix = "latest"
herdr = "latest"
node = "latest"
pnpm = "latest"
starship = "latest"
github-cli = "latest"
fzf = "latest"
hunk = "latest"
eza = "latest"
zoxide = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
codex = "latest"
yazi = "latest"
lazygit = "latest"
"github:mickael-menu/zk" = "latest"
rust = "latest"
cmake = "latest"
gitui = "latest"
glow = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:intelephense" = "latest"
tombi = "latest"

[tasks.format]
description = "Format TOML files"
run = '''
cd "$MISE_TASK_DIR"
fd -H -e toml -E .git -X tombi format
'''

[tasks."format:check"]
description = "Check TOML formatting"
run = '''
cd "$MISE_TASK_DIR"
fd -H -e toml -E .git -X tombi format --check
'''

[tasks.lint]
description = "Lint TOML files"
run = '''
cd "$MISE_TASK_DIR"
fd -H -e toml -E .git -X tombi lint
'''

[tasks.check]
description = "Run all checks"
depends = ["format:check", "lint"]

[dotfiles]
"~/.agents" = { source = "home/.agents" }
"~/.config/ghostty" = "home/.config/ghostty"
"~/.config/git" = "home/.config/git"
"~/.config/helix" = "home/.config/helix"
"~/.config/herdr/config.toml" = "home/.config/herdr/config.toml"
"~/.config/lazygit" = { source = "home/.config/lazygit" }
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/mise/mise.linux.toml" = "mise.linux.toml"
"~/.config/mise/mise.macos.toml" = "mise.macos.toml"
"~/.config/nvim" = { source = "home/.config/nvim" }
"~/.config/starship.toml" = { source = "home/.config/starship.toml" }
"~/.config/yazi" = { source = "home/.config/yazi" }
"~/.zshrc" = "home/.zshrc"
